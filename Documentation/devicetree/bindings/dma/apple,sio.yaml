%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,sio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T7000/S8000/T8010 SmartIO coprocessor and DMA controller

description: |
  The T7000 (A8, A8X), S8000 (A9) and T8010 (A10) SmartIO coprocessor
  provides DMA channels
  for peripheral controllers. The application processor boots the SmartIO
  firmware and submits DMA commands through the SIO message queues. Clients
  select the firmware endpoint number used by their peripheral.

maintainers:
  - Paul Praschl <praschlpaul@g-p.at>

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    enum:
      - apple,t7000-sio
      - apple,s8000-sio
      - apple,t8010-sio

  reg:
    minItems: 1
    items:
      - description: AppleA7IOP coprocessor and message queue registers
      - description: SmartIO DMA shim registers

  reg-names:
    minItems: 1
    items:
      - const: a7iop
      - const: shim

  interrupts:
    minItems: 4
    maxItems: 4
    description:
      The four interrupt outputs of the SIO node in the Apple device tree, in
      the same order.

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1
    description:
      Power-state reset, used if the coprocessor is found already running.

  firmware-name:
    maxItems: 1

  dma-channels:
    const: 64

  '#dma-cells':
    const: 1
    description:
      Clients specify the SmartIO DMA endpoint number, for example 0x1a for
      SPI3 transmit, 0x1b for SPI3 receive or 0x28 for MCA0 transmit.

if:
  properties:
    compatible:
      contains:
        enum:
          - apple,s8000-sio
          - apple,t8010-sio
then:
  properties:
    reg:
      minItems: 2
    reg-names:
      minItems: 2
else:
  description:
    The T7000's AppleA7IOP version 1 block is a single 0x2000 window, and
    Apple's device tree describes no shim registers for it.
  properties:
    reg:
      maxItems: 1
    reg-names:
      maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - power-domains
  - firmware-name
  - dma-channels
  - '#dma-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      sio: dma-controller@20ae00000 {
        compatible = "apple,t8010-sio";
        reg = <0x2 0x0ae00000 0x0 0x10000>,
              <0x2 0x0a000000 0x0 0x2000>;
        reg-names = "a7iop", "shim";
        interrupts = <AIC_IRQ 211 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 210 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 213 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 212 IRQ_TYPE_LEVEL_HIGH>;
        power-domains = <&ps_sio>;
        firmware-name = "apple/t8010-smartio.bin";
        dma-channels = <64>;
        #dma-cells = <1>;
      };
    };
