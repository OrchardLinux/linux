%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/maxim,max98925.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim Integrated MAX98721/MAX98925/MAX98926/MAX98927 speaker amplifier

maintainers:
  - Ryan Lee <ryans.lee@maximintegrated.com>

description:
  The MAX98721 is a variant of the MAX98925 found in Apple devices. It runs
  as a TDM consumer and plays the first slot of its DAI link's
  dai-tdm-slot-rx-mask.

properties:
  compatible:
    enum:
      - maxim,max98721
      - maxim,max98925
      - maxim,max98926
      - maxim,max98927

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  port:
    $ref: audio-graph-port.yaml#
    unevaluatedProperties: false

  vmon-slot-no:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 30
    default: 0
    description:
      Slot number used to send voltage information or in inteleave mode this
      will be used as interleave slot.

  imon-slot-no:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 30
    default: 0
    description:
      Slot number used to send current information.

  maxim,interleave-mode:
    type: boolean
    description:
      When using two MAX9892X in a system it is possible to create ADC data
      that will overflow the frame size. When enabled, the Digital Audio
      Interleave mode provides a means to output VMON and IMON data from two
      devices on a single DOUT line when running smaller frames sizes such as
      32 BCLKS per LRCLK or 48 BCLKS per LRCLK.

required:
  - compatible
  - reg

allOf:
  - $ref: dai-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - maxim,max98927
    then:
      properties:
        vmon-slot-no:
          minimum: 0
          maximum: 15

        imon-slot-no:
          minimum: 0
          maximum: 15

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-codec@3a {
            compatible = "maxim,max98927";
            reg = <0x3a>;
            #sound-dai-cells = <0>;

            pinctrl-0 = <&speaker_default>;
            pinctrl-names = "default";

            reset-gpios = <&tlmm 69 GPIO_ACTIVE_LOW>;

            vmon-slot-no = <1>;
            imon-slot-no = <0>;
        };
    };

  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        amplifier@31 {
            compatible = "maxim,max98721";
            reg = <0x31>;
            interrupts-extended = <&pinctrl 8 IRQ_TYPE_LEVEL_LOW>;
            #sound-dai-cells = <0>;
            sound-name-prefix = "Amp0";

            port {
                endpoint {
                    remote-endpoint = <&speaker_amp0_ep>;
                    dai-tdm-slot-num = <8>;
                    dai-tdm-slot-width = <32>;
                    dai-tdm-slot-rx-mask = <1>;
                };
            };
        };
    };
