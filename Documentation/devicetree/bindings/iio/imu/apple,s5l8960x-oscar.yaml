%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/imu/apple,s5l8960x-oscar.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M7 motion coprocessor

maintainers:
  - ricktav <82380971+ricktav@users.noreply.github.com>

description:
  The M7 ("Oscar") of the Apple A7 iPads, a microcontroller on a UART that
  carries the accelerometer, gyroscope and compass. It has no firmware of its
  own; the host uploads it at every power-up.

allOf:
  - $ref: /schemas/serial/serial-peripheral-props.yaml#

properties:
  compatible:
    const: apple,s5l8960x-oscar

  core-supply:
    description: M7 core supply (Apple's oscar_power1).

  io-supply:
    description: M7 I/O supply (Apple's oscar_power2).

  sensors-supply:
    description: Sensor supply (Apple's sensor_power).

  reset-gpios:
    maxItems: 1

  firmware-name:
    maxItems: 1

  mount-matrix:
    description: Orientation of the accelerometer in the device.

required:
  - compatible
  - core-supply
  - io-supply
  - sensors-supply
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    serial {
        motion-coprocessor {
            compatible = "apple,s5l8960x-oscar";
            core-supply = <&oscar_core>;
            io-supply = <&oscar_io>;
            sensors-supply = <&oscar_sensors>;
            reset-gpios = <&pinctrl 66 GPIO_ACTIVE_LOW>;
            mount-matrix = "1", "0", "0",
                           "0", "-1", "0",
                           "0", "0", "1";
        };
    };

...
