%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,t8011-h9g-display.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple A10X H9G display controller

maintainers:
  - tom <tompt@seznam.cz>

description: |
  The H9G display controller scans out to the internal panel. The bootloader
  may leave the controller, link and panel running with a simple framebuffer.
  The simple-framebuffer node's display phandle identifies the controller.

properties:
  compatible:
    const: apple,t8011-h9g-display

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
