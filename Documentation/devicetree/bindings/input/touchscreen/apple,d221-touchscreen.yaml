%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/apple,d221-touchscreen.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple iPhone X and iPhone XR HIDSPI touchscreens

maintainers:
  - Eduardo Martins <eduardo@martins.ws>

description:
  The touch controllers of the iPhone X (ADT "hid-transport,k1") and the
  iPhone XR (ADT "hid-transport,spi") on an SPI bus. They start in an HBPP
  bootloader that loads the firmware from the host, then report touches over
  Apple's HIDSPI transport. The per-unit calibrations come from the ADT's
  multi-touch node; the bootloader copies them through the touchscreen0
  alias.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - if:
      properties:
        compatible:
          const: apple,d221-touchscreen
    then:
      properties:
        hv-supply: false
        core-supply: false
        clken-supply: false
      required:
        - interrupts
        - ana-supply
        - clocks
    else:
      properties:
        ana-supply: false
        clocks: false
      required:
        - hv-supply
        - core-supply
        - clken-supply

properties:
  compatible:
    enum:
      - apple,d221-touchscreen
      - apple,n841-touchscreen

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description:
      The controller's interrupt line, low while a packet waits on the
      iPhone X. Not used on the iPhone XR: its line (AOP pin 19) was measured
      not to move for the firmware's boot message, replies or touch reports,
      so the driver reads on a timer there.

  reset-gpios:
    maxItems: 1

  ana-supply:
    description: Analog supply of the touch controller.

  hv-supply:
    description:
      Analog supply of the touch controller from the display PMU, the ADT's
      function-power_ana.

  core-supply:
    description:
      Core supply of the touch controller, the ADT's function-power_ldo.

  clken-supply:
    description:
      Switch of the touch controller's clock, the ADT's
      function-clock_enable, where the SMC provides it.

  clocks:
    maxItems: 1

  firmware-name:
    maxItems: 1
    description:
      Start of the controller firmware's file name; the driver appends
      -<apple,hid-merge-personality>.bin. The firmware is converted from
      Apple's multitouch firmware.

  apple,hid-merge-personality:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      The ADT's hid-merge-personality, the firmware variant this unit needs.

  apple,z2-cal-blob:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: The ADT's multi-touch-calibration.

patternProperties:
  "^apple,luna-[a-z-]+$":
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: The ADT's 3D Touch calibrations, under their ADT names.

required:
  - compatible
  - reg
  - reset-gpios
  - firmware-name
  - apple,hid-merge-personality

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "apple,d221-touchscreen";
            reg = <0>;
            spi-max-frequency = <4000000>;
            interrupts-extended = <&pinctrl_aop 21 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&pinctrl_ap 33 GPIO_ACTIVE_LOW>;
            ana-supply = <&touch_ana>;
            clocks = <&touchclk>;
            firmware-name = "apple/d221-touch";
            apple,hid-merge-personality = "C1R1FC0,2";
            touchscreen-size-x = <1125>;
            touchscreen-size-y = <2436>;
        };
    };

...
